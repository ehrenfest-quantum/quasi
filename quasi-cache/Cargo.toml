[package]
name = "quasi-cache"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Content-addressed result cache for QUASI quantum computations"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
