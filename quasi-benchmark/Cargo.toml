[package]
name = "quasi-benchmark"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "GPCR quantum chemistry benchmark: UCL/IQM/NVIDIA vs QUASI/Huoma"
repository = "https://github.com/ehrenfest-quantum/quasi"

[[bin]]
name = "quasi-benchmark"
path = "src/main.rs"

[lib]
name = "quasi_benchmark"
path = "src/lib.rs"

[dependencies]
quasi-bridge = { path = "../quasi-bridge" }
afana = { path = "../afana" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
