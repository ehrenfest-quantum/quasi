# QUASI Cargo workspace — all Rust crates live here.

[workspace]
members = [
    "afana",
    "quasi-bridge",
    "quasi-cache",
    "quasi-cudaq-ffi",
    "quasi-demo",
    "quasi-scheduler",
    "quasi-senate",
    "quasi-solvayeur",
    "sword-classical-adapter",
    "sword-ml-adapter",
]
resolver = "2"

[workspace.dependencies]
hal-contract = { git = "https://github.com/hiq-lab/hal-contract-spec.git", rev = "dcc7caa" }
