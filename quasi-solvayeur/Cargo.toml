[package]
name = "quasi-solvayeur"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Solvayeur quantum kernel — QPU-native resource scheduler using the ATW algorithm"

[dependencies]
afana = { path = "../afana" }
quasi-scheduler = { path = "../quasi-scheduler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
