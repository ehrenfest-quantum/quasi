[package]
name = "quasi-bridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Garm → QUASI bridge: molecular Hamiltonian pipeline (SMILES → Ehrenfest → Afana → energy)"
repository = "https://github.com/ehrenfest-quantum/quasi"

[[bin]]
name = "quasi-bridge"
path = "src/main.rs"

[lib]
name = "quasi_bridge"
path = "src/lib.rs"

[dependencies]
afana = { path = "../afana" }
quasi-solvayeur = { path = "../quasi-solvayeur" }
quasi-scheduler = { path = "../quasi-scheduler" }
quasi-cache = { path = "../quasi-cache" }

# HTTP server (matches Garm-engine's quasi_client.rs contract)
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CBOR serialization (same as Afana)
ciborium = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linear algebra for RHF solver
nalgebra = "0.33"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
