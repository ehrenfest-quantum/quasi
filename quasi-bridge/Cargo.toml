[package]
name = "quasi-bridge"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Chemistry primitives library: JW transform, exact-diag, Ehrenfest CBOR build. Library only — the SMILES→energy service that used to live here was abandoned in favour of the smiles_energy kata in Arn (consolidation roadmap, 2026-05-07)."
repository = "https://github.com/ehrenfest-quantum/quasi"

[lib]
name = "quasi_bridge"
path = "src/lib.rs"

[dependencies]
# Afana types — needed by ehrenfest_mol (PauliTerm, EhrenfestProgram).
afana = { path = "../afana" }

# CBOR serialization (matches Afana's wire format).
ciborium = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linear algebra for the RHF solver and exact diag.
nalgebra = "0.33"

# Error handling
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
